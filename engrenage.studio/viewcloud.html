<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Gallery</title>

    <style>
        :root{
            --bg:#f5f7fb;
            --card:#ffffff;
            --text:#20232a;
            --sub:#6b7280;
            --accent:#3b82f6;
            --shadow:0 10px 30px rgba(0,0,0,.08);
            --radius:18px;
        }

        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
            font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
        }

        body{
            background:var(--bg);
            color:var(--text);
        }

        #page_root{
            max-width:1800px;
            margin:auto;
            padding:30px;
        }

        #header_container{
            position:sticky;
            top:0;
            z-index:100;
            background:rgba(245,247,251,.92);
            backdrop-filter:blur(18px);
            border-radius:var(--radius);
            box-shadow:var(--shadow);
            padding:30px;
            margin-bottom:30px;
        }

        #title_text{
            font-size:42px;
            font-weight:700;
        }

        #stats_container{
            display:flex;
            flex-wrap:wrap;
            gap:20px;
            margin-top:20px;
        }

        .stats_box{
            background:white;
            border-radius:14px;
            padding:18px 26px;
            box-shadow:var(--shadow);
        }

        .stats_value{
            font-size:30px;
            font-weight:bold;
        }

        .stats_label{
            color:var(--sub);
            font-size:18px;
        }

        #gallery_grid{
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
            gap:28px;
        }

        .media_card{
            position:relative;
            overflow:hidden;
            background:white;
            border-radius:20px;
            box-shadow:var(--shadow);
            transition:.25s;
            cursor:pointer;
        }

        .media_card:hover{
            transform:translateY(-6px);
        }

        .media_thumbnail{
            width:100%;
            height:240px;
            object-fit:cover;
            display:block;
        }

        .media_overlay{
            position:absolute;
            inset:0;
            background:rgba(0,0,0,.78);
            color:white;
            opacity:0;
            transition:.25s;
            padding:22px;
            display:flex;
            flex-direction:column;
            justify-content:center;
            gap:10px;
            font-size:18px;
        }

        .media_card:hover .media_overlay{
            opacity:1;
        }

        #loading_container{
            text-align:center;
            padding:60px;
            font-size:28px;
            color:var(--sub);
        }
        
#viewer_overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.94);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:20000;
}

#viewer_content{
    max-width:95vw;
    max-height:95vh;
    display:flex;
    flex-direction:column;
    align-items:center;
}

#viewer_image,
#viewer_video{
    max-width:90vw;
    max-height:85vh;
    border-radius:15px;
    transition: opacity .2s ease;
}

#viewer_video{
    display:none;
}

#viewer_close,
#viewer_prev,
#viewer_next{

    position:absolute;
    background:rgba(255,255,255,.15);
    border:none;
    color:white;
    font-size:60px;
    width:70px;
    height:70px;
    border-radius:50%;
    cursor:pointer;

}

#viewer_close{
    top:25px;
    right:30px;
    font-size:45px;
}

#viewer_prev{
    left:30px;
}

#viewer_next{
    right:30px;
}

#viewer_counter{
    color:white;
    font-size:22px;
    margin-top:15px;
}

#viewer_info{

    margin-top:12px;

    color:white;

    text-align:center;

    font-size:14px;

    opacity:.85;

    max-width:90vw;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

}


#viewer_filename{

    font-size:17px;

    font-weight:600;

}


#viewer_details{

    margin-top:4px;

    color:rgba(255,255,255,.7);

}


#search_container{
    margin-top:25px;
}

#search_input{

    width:100%;
    max-width:600px;

    padding:16px 22px;

    font-size:22px;

    border-radius:30px;
    border:none;

    background:white;

    box-shadow:0 8px 25px rgba(0,0,0,.08);

    outline:none;
}

#search_input:focus{

    box-shadow:
        0 0 0 3px rgba(59,130,246,.25),
        0 8px 25px rgba(0,0,0,.08);

}

@media(max-width:700px){

    #viewer_prev,
    #viewer_next{
        width:55px;
        height:55px;
        font-size:40px;
    }

}

        @media(max-width:700px){

            #title_text{
                font-size:32px;
            }

            .stats_value{
                font-size:24px;
            }

            .media_thumbnail{
                height:220px;
            }

        }
        
    .hidden {
  display: none !important;
}
    </style>

</head>

<body>

    <div id="page_root">

        <div id="header_container">

            <div id="title_text"></div>

            <div id="stats_container">

                <div id="stats_files_box" class="stats_box">
                    <div id="stats_files_value" class="stats_value">0</div>
                    <div id="stats_files_label" class="stats_label"></div>
                </div>

                <div id="stats_size_box" class="stats_box">
                    <div id="stats_size_value" class="stats_value">0 MB</div>
                    <div id="stats_size_label" class="stats_label"></div>
                </div>

            </div>
            
            <div id="search_container">

                <input
                    id="search_input"
                    type="search"
                    placeholder="Search..."
                >
                
                <div id="stats_files_found_box" class="stats_box" style="width:100px">
                    <div id="stats_files_found_value" class="stats_value">0</div>
                    <div id="stats_files_found_label" class="stats_label">(found)</div>
                </div>


            </div>

        </div>

        <div id="gallery_grid"></div>

        <div id="loading_container"></div>

    </div>
    
    <div id="viewer_overlay">
        <button id="viewer_close">×</button>
        <button id="viewer_prev">‹</button>
        <div id="viewer_content">
            <img id="viewer_image">
            <video id="viewer_video" controls></video>
            <div id="viewer_info">
                <div id="viewer_filename"></div>
                <div id="viewer_details"></div>
            </div>
            <div id="viewer_counter"></div>
        </div>
        <button id="viewer_next">›</button>
    </div>

<script>

const language = navigator.language.toLowerCase().startsWith("fr") ? "fr" : "en";

const text = {

    fr:{
        title:"Galerie média",
        files:"Fichiers",
        filesfound:"Fichier(s) trouvÃ©((s)",
        size:"Taille totale",
        loading:"Chargement...",
        folder:"Dossier",
        file:"Fichier",
        date:"Date",
        bytes:"Taille"
    },

    en:{
        title:"Media Gallery",
        files:"Files",
        filesfound:"Found File(s)",
        size:"Total size",
        loading:"Loading...",
        folder:"Folder",
        file:"File",
        date:"Date",
        bytes:"Size"
    }

};

const ui = text[language];

document.getElementById("title_text").textContent = ui.title;
document.getElementById("stats_files_label").textContent = ui.files;
document.getElementById("stats_size_label").textContent = ui.size;
document.getElementById("loading_container").textContent = ui.loading;

let mediaFiles = [];
let filteredFiles = [];
let currentIndex = 0;
const pageSize = 20;

async function loadMedia(){


    const params = new URLSearchParams(window.location.search);

    const pwd = params.get("pwd") || "";

    const response = await fetch( "/viewcloud.py?list&pwd=" + encodeURIComponent(pwd) );
    
    console.log( "Response:", response )

    mediaFiles = await response.json();
    
    filteredFiles = mediaFiles.files;
    document.getElementById("stats_files_found_box").classList.add("hidden")
    
    console.log( "mediaFiles:", mediaFiles )

    document.getElementById("stats_files_value").textContent = mediaFiles.count;

    let total = 0;

    mediaFiles.files.forEach(f=>total += f.size);

    document.getElementById("stats_size_value").textContent = formatSize(total);

    appendCards();

}

function appendCards(){

    console.log( "appendCards: entering" )

    const grid = document.getElementById("gallery_grid");

    const end = Math.min(     currentIndex + pageSize,     filteredFiles.length );

    for(let i=currentIndex;i<end;i++){

        const item = filteredFiles[i];

        const card = document.createElement("div");
        card.className="media_card";
        
        let is_video = ( item.type==="video" && item.thumbnail.match(/\.(mp4|mov|mkv|webm|avi)$/i) )

        const img = document.createElement(is_video?"video":"img");
        img.className="media_thumbnail";
        img.src=item.thumbnail;
        
        card.onclick = () => openViewer(filteredFiles.indexOf(item));

        if( is_video ){
            img.muted=true;
            img.loop=true;
            img.autoplay=true;
            img.playsInline=true;
        }

        const overlay=document.createElement("div");
        overlay.className="media_overlay";

        overlay.innerHTML=
            "<b>"+ui.file+"</b><div>"+item.name+"</div>"+
            "<b>"+ui.folder+"</b><div><font size=-3>"+item.folder.replace("/home/na/dev/git/electronoos/engrenage.studio/", "")+"</font></div>"+
            "<b>"+ui.bytes+"</b><div>"+formatSize(item.size)+"</div>"+
            "<b>"+ui.date+"</b><div>"+new Date(item.date).toLocaleString()+"</div>";

        card.appendChild(img);
        card.appendChild(overlay);

        grid.appendChild(card);
    }

    currentIndex=end;

    document.getElementById("loading_container").style.display=currentIndex>=mediaFiles.count?"none":"block";


    console.log( "appendCards: ending..." )
}

let viewerIndex = 0;


function openViewer(index){

    viewerIndex = index;

    updateViewer();

    document.getElementById("viewer_overlay").style.display="flex";

}


function updateViewer(){

    const item = filteredFiles[viewerIndex];

    const image = document.getElementById("viewer_image");
    const video = document.getElementById("viewer_video");

    if(item.type==="video"){

        image.style.display="none";

        video.style.display="block";
        video.src=item.url;
        video.play();

    }
    else{
        video.pause();
        video.src="";

        video.style.display="none";
        image.style.display="block";
//~         image.src=item.url;

        image.style.opacity = "0.3";

        const newImage = new Image();

        newImage.onload = function(){
            image.src = item.url;
            image.style.opacity = "1";
        };

        newImage.src = item.url;
    }


    document.getElementById("viewer_counter").textContent =
        (viewerIndex+1)+" / "+filteredFiles.length;
        
        document.getElementById("viewer_filename").textContent =
    item.name;


document.getElementById("viewer_details").textContent =
    item.folder.replace("/home/na/dev/git/electronoos/engrenage.studio/", "") +
    " - " +
    formatSize(item.size) +
    " - " +
    new Date(item.date).toLocaleString();

}


function closeViewer(){

    const overlay=document.getElementById("viewer_overlay");

    overlay.style.display="none";

    const video=document.getElementById("viewer_video");

    video.pause();
    video.src="";

}


function nextViewer(){

    if(viewerIndex>=currentIndex && currentIndex<mediaFiles.count)
    {
        appendCards();
    }

    if(viewerIndex < mediaFiles.count-1){
        viewerIndex++;
        updateViewer();
    }

}


function previousViewer(){

    if(viewerIndex > 0){

        viewerIndex--;
        updateViewer();

    }

}


document.getElementById("viewer_close").onclick=closeViewer;


document.getElementById("viewer_next").onclick=nextViewer;


document.getElementById("viewer_prev").onclick=previousViewer;


document.getElementById("viewer_overlay").onclick=function(e){

    if(e.target===this){
        closeViewer();
    }

};


document.addEventListener("keydown",function(e){

    const visible =
        document.getElementById("viewer_overlay").style.display==="flex";

    if(!visible)
        return;


    if(e.key==="Escape")
        closeViewer();

    if(e.key==="ArrowRight")
        nextViewer();

    if(e.key==="ArrowLeft")
        previousViewer();

});

function formatSize(bytes){

    const units=["B","KB","MB","GB","TB"];

    let i=0;

    while(bytes>1024 && i<units.length-1){
        bytes/=1024;
        i++;
    }

    return bytes.toFixed(1)+" "+units[i];

}


// scroll en bas, charge plus d'images.
window.addEventListener("scroll",()=>{

    if(window.innerHeight+window.scrollY>document.body.offsetHeight-800){

        if(currentIndex<mediaFiles.count){
            appendCards();
        }

    }

});

document.getElementById("search_input")
.addEventListener("input", function(){

    const value = this.value.toLowerCase().trim();

    if(value==="")
    {
        filteredFiles = mediaFiles.files;
        document.getElementById("stats_files_found_box").classList.add("hidden")
        
    }
    else{

        filteredFiles = mediaFiles.files.filter(item =>
            item.name.toLowerCase().includes(value)
        );

        document.getElementById("stats_files_found_value").textContent = filteredFiles.length;
        document.getElementById("stats_files_found_label").textContent = ui.filesfound;
        document.getElementById("stats_files_found_box").classList.remove("hidden")
    }


    document.getElementById("gallery_grid").innerHTML="";

    currentIndex=0;

    appendCards();

});

loadMedia();

</script>

</body>
</html>
