<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/almatools/icon_at.png">
    <title id="page_title">Computer Chat</title>

    <style id="page_style">
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
            color: #171717;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #chat_app {
            width: 100%;
            max-width: 900px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #ffffff;
        }

        #chat_header {
            flex: 0 0 auto;
            padding: 22px 24px;
            border-bottom: 1px solid #dedede;
            background: #ffffff;
        }

        #chat_title {
            margin: 0;
            font-size: clamp(24px, 5vw, 38px);
            font-weight: 700;
            letter-spacing: -1px;
        }

        #chat_status {
            margin-top: 5px;
            color: #777777;
            font-size: clamp(14px, 3vw, 17px);
        }

        #chat_messages {
            flex: 1 1 auto;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .message_container {
            max-width: 78%;
            display: flex;
            flex-direction: column;
        }

        .message_container_user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message_container_computer {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message_bubble {
            padding: 15px 18px;
            border-radius: 18px;
            font-size: clamp(18px, 4vw, 25px);
            line-height: 1.35;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .message_bubble_user {
            background: #171717;
            color: #ffffff;
            border-bottom-right-radius: 5px;
        }

        .message_bubble_computer {
            background: #e9e9e9;
            color: #171717;
            border-bottom-left-radius: 5px;
        }

        .message_metadata {
            display: flex;
            flex-direction: column;
            align-items: inherit;
            margin-top: 3px;
            padding: 0 5px;
            color: #999999;
            font-size: 11px;
            line-height: 1.25;
            white-space: nowrap;
        }

        .message_metadata_inline {
            flex-direction: row;
            gap: 6px;
        }

        .message_date,
        .message_time,
        .message_duration {
            display: block;
        }
        
        .message_duration:empty {
            display: none;
        }

        .typing_dots {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 24px;
            min-width: 38px;
        }

        .typing_dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #777777;
            animation: typing_animation 1.2s infinite ease-in-out;
        }

        .typing_dot:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing_dot:nth-child(3) {
            animation-delay: 0.30s;
        }

        @keyframes typing_animation {
            0%, 60%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-3px);
            }
        }

        #chat_controls {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 14px;
            border-top: 1px solid #dedede;
            background: #ffffff;
        }

        #chat_user_settings {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #user_id_label {
            font-size: 14px;
            font-weight: 700;
        }

        #user_id {
            min-width: 0;
            padding: 8px 12px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            background: #ffffff;
            color: #171717;
            font-family: inherit;
            font-size: 15px;
        }

        #chat_input_area {
            display: flex;
            gap: 10px;
        }

        #user_input {
            flex: 1;
            min-width: 0;
            min-height: 56px;
            max-height: 180px;
            resize: vertical;
            border: 2px solid #cccccc;
            border-radius: 14px;
            padding: 12px 15px;
            font-family: inherit;
            font-size: 20px;
            line-height: 1.3;
            outline: none;
        }

        #user_input:focus {
            border-color: #171717;
        }

        #send_button {
            flex: 0 0 auto;
            min-width: 90px;
            border: 0;
            border-radius: 14px;
            background: #171717;
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            padding: 0 18px;
        }

        #send_button:hover {
            background: #333333;
        }

        #send_button:active {
            transform: scale(0.98);
        }

        #send_button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        @media (max-width: 600px) {
            #chat_header {
                padding: 17px 18px;
            }

            #chat_messages {
                padding: 16px;
            }

            .message_container {
                max-width: 88%;
            }

            .message_bubble {
                font-size: 19px;
            }

            #chat_controls {
                padding: 10px;
            }

            #send_button {
                min-width: 70px;
                padding: 0 12px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <main id="chat_app">
        <header id="chat_header">
            <h1 id="chat_title">Robot</h1>
            <div id="chat_status" hidden>Mode clinic</div>
            <div id="chat_user_settings">
                <label id="user_id_label" for="user_id">
                    User ID
                </label>

                <select id="user_id" name="user_id">
                    <option value="web">web</option>
                    <option value="web_clinic" selected>web_clinic</option>
                </select>
            </div>
            
        </header>

        <section id="chat_messages" aria-live="polite">
            <div
                id="message_container_initial"
                class="message_container message_container_computer"
            >
                <div
                    id="message_bubble_initial"
                    class="message_bubble message_bubble_computer"
                >
                    Hello. How can I help you?
                </div>

                <div
                    id="message_metadata_initial"
                    class="message_metadata"
                >
                    <div
                        id="message_date_initial"
                        class="message_date"
                    ></div>

                    <div
                        id="message_time_initial"
                        class="message_time"
                    ></div>
                    
                    <div
                        id="message_duration_initial"
                        class="message_duration"
                    ></div>
                </div>
            </div>
        </section>

        <div id="chat_controls">

            <form id="chat_input_area">
                <textarea
                    id="user_input"
                    autocomplete="off"
                    spellcheck="true"
                    rows="1"
                    placeholder="Write a message..."
                ></textarea>

                <button id="send_button" type="submit">
                    Send
                </button>
            </form>
        </div>
    </main>

    <script id="page_script">
        const language_data = {
            en: {
                title: "Alma Robot",
                status: "Clinic Mode",
                thinking: "Thinking...",
                placeholder: "Write a message...",
                send: "Send",
                initial: "Hello. How can I help you?",
                error: "Communication error.",
                empty_response: "The server returned an empty response."
            },

            fr: {
                title: "Alma Robot",
                status: "Mode clinique privée",
                thinking: "En cours...",
                placeholder: "Écrivez un message...",
                send: "Envoyer",
                initial: "Bonjour. Comment puis-je vous aider ?",
                error: "Erreur lors de la communication.",
                empty_response: "Le serveur a renvoyé une réponse vide."
            }
        };

        let current_language = "en";
        let pending_requests = 0;


        function detect_language() {
            const browser_language = (
                navigator.language ||
                navigator.userLanguage ||
                "en"
            ).toLowerCase();

            current_language = browser_language.startsWith("fr")
                ? "fr"
                : "en";
        }


        function apply_language() {
            const language = language_data[current_language];

            document.documentElement.lang = current_language;
            document.title = language.title;

            document.getElementById("chat_title").textContent = language.title;
            document.getElementById("chat_status").textContent = language.status;
            document.getElementById("user_input").placeholder = language.placeholder;
            document.getElementById("send_button").textContent = language.send;
            document.getElementById("user_id_label").textContent = "User ID";
            

            document.getElementById("message_bubble_initial").textContent =
                language.initial;

            const initial_bubble = document.getElementById("message_bubble_initial");
            const initial_metadata = document.getElementById("message_metadata_initial");
            const initial_date = document.getElementById("message_date_initial");
            const initial_time = document.getElementById("message_time_initial");
            const initial_duration = document.getElementById("message_duration_initial");

            if (!initial_bubble.dataset.timestamp) {
                initial_bubble.dataset.timestamp = new Date().toISOString();
            }

            set_message_metadata(
                initial_bubble,
                initial_metadata,
                initial_date,
                initial_time,
                initial_duration
            );
        }


        function get_date_from_timestamp(timestamp) {
            return new Intl.DateTimeFormat(
                current_language === "fr" ? "fr-FR" : "en-US",
                {
                    weekday: "short",
                    day: "numeric",
                    month: "short"
                }
            ).format(new Date(timestamp));
        }


        function get_time_from_timestamp(timestamp) {
            return new Intl.DateTimeFormat(
                current_language === "fr" ? "fr-FR" : "en-US",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            ).format(new Date(timestamp));
        }
        

    function format_duration(duration_seconds) {
        const formatted_duration = new Intl.NumberFormat(
            current_language === "fr" ? "fr-FR" : "en-US",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        ).format(duration_seconds);

        return formatted_duration + " s";
    }



function set_message_metadata(
    bubble_element,
    metadata_element,
    date_element,
    time_element,
    duration_element
) {
    let timestamp = bubble_element.dataset.timestamp;

    if (!timestamp) {
        timestamp = new Date().toISOString();
        bubble_element.dataset.timestamp = timestamp;
    }

    date_element.textContent = get_date_from_timestamp(timestamp);
    time_element.textContent = get_time_from_timestamp(timestamp);

    const duration = bubble_element.dataset.duration;

    duration_element.textContent = duration
        ? "( in " + format_duration(Number(duration)) + ")"
        : "";

    metadata_element.classList.remove("message_metadata_inline");

    requestAnimationFrame(function () {
        const bubble_width = bubble_element.getBoundingClientRect().width;
        const date_width = date_element.getBoundingClientRect().width;
        const time_width = time_element.getBoundingClientRect().width;
        const duration_width = duration_element.getBoundingClientRect().width;

        const metadata_width = date_width + time_width + duration_width +
            (duration ? 12 : 6);

        if (metadata_width <= bubble_width) {
            metadata_element.classList.add("message_metadata_inline");
        }
    });
}


        function scroll_to_bottom() {
            const messages_element = document.getElementById("chat_messages");

            messages_element.scrollTo({
                top: messages_element.scrollHeight,
                behavior: "smooth"
            });
        }


        function create_message_container(sender_type, timestamp = null) {
            const unique_id = Date.now() + "_" +
                Math.random().toString(36).substring(2, 8);

            const container_element = document.createElement("div");
            const bubble_element = document.createElement("div");
            const metadata_element = document.createElement("div");
            const date_element = document.createElement("div");
            const time_element = document.createElement("div");
            const duration_element = document.createElement("div");

            container_element.id = "message_container_" + sender_type + "_" + unique_id;
            bubble_element.id = "message_bubble_" + sender_type + "_" + unique_id;
            metadata_element.id = "message_metadata_" + sender_type + "_" + unique_id;
            date_element.id = "message_date_" + sender_type + "_" + unique_id;
            time_element.id = "message_time_" + sender_type + "_" + unique_id;
            duration_element.id = "message_duration_" + sender_type + "_" + unique_id;

            container_element.className = "message_container message_container_" + sender_type;
            bubble_element.className = "message_bubble message_bubble_" + sender_type;
            metadata_element.className = "message_metadata";
            date_element.className = "message_date";
            time_element.className = "message_time";
            duration_element.className = "message_duration";

            bubble_element.dataset.timestamp = timestamp || new Date().toISOString();

            metadata_element.appendChild(date_element);
            metadata_element.appendChild(time_element);
            metadata_element.appendChild(duration_element);
            container_element.appendChild(bubble_element);
            container_element.appendChild(metadata_element);

            return {
                container: container_element,
                bubble: bubble_element,
                metadata: metadata_element,
                date: date_element,
                time: time_element,
                duration: duration_element
            };
        }


        function add_message(message_text, sender_type, timestamp = null) {
            const message_elements = create_message_container(sender_type, timestamp);

            message_elements.bubble.textContent = message_text;

            document.getElementById("chat_messages").appendChild(
                message_elements.container
            );

            set_message_metadata(
                message_elements.bubble,
                message_elements.metadata,
                message_elements.date,
                message_elements.time,
                message_elements.duration
            );

            scroll_to_bottom();

            return message_elements;
        }


        function add_user_message(message_text, timestamp = null) {
            return add_message(message_text, "user", timestamp);
        }


        function create_typing_message() {
            const message_elements = create_message_container("computer", null);

            // Le timestamp définitif sera celui de réception de la réponse.
            delete message_elements.bubble.dataset.timestamp;

            const typing_container = document.createElement("span");
            const first_dot = document.createElement("span");
            const second_dot = document.createElement("span");
            const third_dot = document.createElement("span");

            const typing_id = Date.now();

            typing_container.id = "typing_indicator_" + typing_id;
            first_dot.id = "typing_dot_1_" + typing_id;
            second_dot.id = "typing_dot_2_" + typing_id;
            third_dot.id = "typing_dot_3_" + typing_id;

            typing_container.className = "typing_dots";
            first_dot.className = "typing_dot";
            second_dot.className = "typing_dot";
            third_dot.className = "typing_dot";

            typing_container.appendChild(first_dot);
            typing_container.appendChild(second_dot);
            typing_container.appendChild(third_dot);

            message_elements.bubble.appendChild(typing_container);

            document.getElementById("chat_messages").appendChild(
                message_elements.container
            );

            scroll_to_bottom();

            return message_elements;
        }


        function prepare_computer_input(user_text, message_timestamp) {
            return {
                message: user_text,
                language: current_language,
                timestamp: message_timestamp || new Date().toISOString()
            };
        }


        function receive_user_input(user_text) {
            const clean_text = user_text.trim();

            if (!clean_text) {
                return null;
            }

            const sent_timestamp = new Date().toISOString();

            add_user_message(clean_text, sent_timestamp);

            const computer_input = prepare_computer_input(
                clean_text,
                sent_timestamp
            );

            pending_requests++;
            update_chat_status();

            return computer_input;
        }


        function update_chat_status() {
            const status_element = document.getElementById("chat_status");

            status_element.textContent = pending_requests > 0
                ? language_data[current_language].thinking
                : language_data[current_language].status;

            document.getElementById("send_button").disabled =
                pending_requests > 0;
        }


        function handle_user_message(user_text) {
            const computer_input = receive_user_input(user_text);

            if (!computer_input) {
                return;
            }

            // La requête réelle démarre immédiatement.
            computer_process_input(computer_input);
        }


        async function computer_process_input(computer_input) {
            console.log("INF: computer_process_input:", computer_input);

            // Les trois points apparaissent pendant l'attente réseau.
            const typing_message = create_typing_message();

            const user_id = document.getElementById("user_id").value;
            const query_parameters = new URLSearchParams({
                id: user_id,
                q: computer_input.message
            });

            const addr = "/chatola/chatola_client.py?" + query_parameters.toString();
            
            const start_time = performance.now();
            
            let response_time = -1;

            try {
                const response = await fetch(addr);

                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }

                const raw_response = await response.text();
                
                response_time = (performance.now() - start_time) / 1000;

                console.log("Raw response:", raw_response, ", in:", response_time.toFixed(2), "s" );

                if (!raw_response.trim()) {
                    throw new Error("Empty server response");
                }

                let answer;

                try {
                    answer = JSON.parse(raw_response);
                } catch {
                    // Le serveur peut aussi renvoyer du texte brut.
                    answer = raw_response;
                }

                let computer_text;
                let computer_timestamp = new Date().toISOString();

                if (typeof answer === "string") {
                    computer_text = answer;
                } else {
                    computer_text = answer.ans;

                    if (answer.timestamp) {
                        computer_timestamp = answer.timestamp;
                    } else if (answer.updated_at) {
                        computer_timestamp = answer.updated_at;
                    }
                }

                if (computer_text == null || !String(computer_text).trim()) {
                    throw new Error("Empty answer");
                }

                display_computer_answer(
                    typing_message,
                    String(computer_text).trim(),
                    computer_timestamp,response_time
                );

            } catch (error) {
                console.error("Erreur lors de la requête:", error);

                const error_message = error.message === "Empty server response" ||
                    error.message === "Empty answer"
                    ? language_data[current_language].empty_response
                    : language_data[current_language].error;

                display_computer_answer(
                    typing_message,
                    error_message,
                    new Date().toISOString(), response_time
                );

            } finally {
                pending_requests--;
                update_chat_status();
            }
        }


        function display_computer_answer(
            typing_message,
            computer_text,
            computer_timestamp,
            response_time
        ) {
            // Remplace les trois points par la réponse du robot.
            typing_message.bubble.textContent = computer_text;
            typing_message.bubble.dataset.timestamp = computer_timestamp;

            // Enregistre la durée de la requête.
            if (response_time >= 0) {
                typing_message.bubble.dataset.duration = response_time;
            } else {
                delete typing_message.bubble.dataset.duration;
            }

            set_message_metadata(
                typing_message.bubble,
                typing_message.metadata,
                typing_message.date,
                typing_message.time,
                typing_message.duration
            );

            scroll_to_bottom();
        }


        document.getElementById("chat_input_area").addEventListener(
            "submit",
            function (event) {
                event.preventDefault();

                const input_element = document.getElementById("user_input");
                const user_text = input_element.value;

                input_element.value = "";

                handle_user_message(user_text);

                input_element.focus();
            }
        );


        document.getElementById("user_input").addEventListener(
            "keydown",
            function (event) {
                if (event.key === "Enter" && !event.shiftKey) {
                    event.preventDefault();
                    document.getElementById("chat_input_area").requestSubmit();
                }
            }
        );


        window.addEventListener("resize", function () {
            const message_elements = document.querySelectorAll(
                ".message_container"
            );

            message_elements.forEach(function (message_element) {
                const bubble_element = message_element.querySelector(
                    ".message_bubble"
                );

                const metadata_element = message_element.querySelector(
                    ".message_metadata"
                );

                const date_element = message_element.querySelector(
                    ".message_date"
                );

                const time_element = message_element.querySelector(
                    ".message_time"
                );
                
                const duration_element = message_element.querySelector( ".message_duration" );

                if (
                    bubble_element &&
                    metadata_element &&
                    date_element &&
                    time_element &&
                    duration_element &&
                    bubble_element.dataset.timestamp
                ) {
                    set_message_metadata(
                        bubble_element,
                        metadata_element,
                        date_element,
                        time_element,
                        duration_element
                    );
                }
            });
        });

document.getElementById("user_id").addEventListener("change", function () {
    const messages_element = document.getElementById("chat_messages");

    messages_element.innerHTML = "";

    const initial_message = add_message(
        language_data[current_language].initial,
        "computer"
    );

    pending_requests = 0;
    update_chat_status();
});

        detect_language();
        apply_language();
    </script>
</body>
</html>
