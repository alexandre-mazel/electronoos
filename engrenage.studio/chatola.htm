<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page_title">Computer Chat</title>

    <style id="page_style">
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
            color: #171717;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #chat_app {
            width: 100%;
            max-width: 900px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #ffffff;
        }

        #chat_header {
            flex: 0 0 auto;
            padding: 22px 24px;
            border-bottom: 1px solid #dedede;
            background: #ffffff;
        }

        #chat_title {
            margin: 0;
            font-size: clamp(24px, 5vw, 38px);
            font-weight: 700;
            letter-spacing: -1px;
        }

        #chat_status {
            margin-top: 5px;
            color: #777777;
            font-size: clamp(14px, 3vw, 17px);
        }

        #chat_messages {
            flex: 1 1 auto;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .message_container {
            max-width: 78%;
            display: flex;
            flex-direction: column;
        }

        .message_container_user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message_container_computer {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message_bubble {
            padding: 15px 18px;
            border-radius: 18px;
            font-size: clamp(18px, 4vw, 25px);
            line-height: 1.35;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .message_bubble_user {
            background: #171717;
            color: #ffffff;
            border-bottom-right-radius: 5px;
        }

        .message_bubble_computer {
            background: #e9e9e9;
            color: #171717;
            border-bottom-left-radius: 5px;
        }

        .message_metadata {
            display: flex;
            flex-direction: column;
            align-items: inherit;
            margin-top: 3px;
            padding: 0 5px;
            color: #999999;
            font-size: 11px;
            line-height: 1.25;
            white-space: nowrap;
        }

        .message_metadata_inline {
            flex-direction: row;
            gap: 6px;
        }

        .message_date,
        .message_time {
            display: block;
        }

        .typing_dots {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 24px;
            min-width: 38px;
        }

        .typing_dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #777777;
            animation: typing_animation 1.2s infinite ease-in-out;
        }

        .typing_dot:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing_dot:nth-child(3) {
            animation-delay: 0.30s;
        }

        @keyframes typing_animation {
            0%,
            60%,
            100% {
                opacity: 0.3;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-3px);
            }
        }

        #chat_input_area {
            flex: 0 0 auto;
            display: flex;
            gap: 10px;
            padding: 14px;
            border-top: 1px solid #dedede;
            background: #ffffff;
        }

        #user_input {
            flex: 1;
            min-width: 0;
            min-height: 56px;
            max-height: 180px;
            resize: vertical;
            border: 2px solid #cccccc;
            border-radius: 14px;
            padding: 12px 15px;
            font-family: inherit;
            font-size: 20px;
            line-height: 1.3;
            outline: none;
        }

        #user_input:focus {
            border-color: #171717;
        }

        #send_button {
            flex: 0 0 auto;
            min-width: 90px;
            border: 0;
            border-radius: 14px;
            background: #171717;
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            padding: 0 18px;
        }

        #send_button:hover {
            background: #333333;
        }

        #send_button:active {
            transform: scale(0.98);
        }

        @media (max-width: 600px) {
            #chat_header {
                padding: 17px 18px;
            }

            #chat_messages {
                padding: 16px;
            }

            .message_container {
                max-width: 88%;
            }

            .message_bubble {
                font-size: 19px;
            }

            #chat_input_area {
                padding: 10px;
            }

            #send_button {
                min-width: 70px;
                padding: 0 12px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <main id="chat_app">
        <header id="chat_header">
            <h1 id="chat_title">Robot</h1>
            <div id="chat_status">Mode clinic</div>
        </header>

        <section id="chat_messages" aria-live="polite">
            <div
                id="message_container_initial"
                class="message_container message_container_computer"
            >
                <div
                    id="message_bubble_initial"
                    class="message_bubble message_bubble_computer"
                >
                    Hello. How can I help you?
                </div>

                <div
                    id="message_metadata_initial"
                    class="message_metadata"
                >
                    <div
                        id="message_date_initial"
                        class="message_date"
                    ></div>

                    <div
                        id="message_time_initial"
                        class="message_time"
                    ></div>
                </div>
            </div>
        </section>

        <form id="chat_input_area">
            <textarea
                id="user_input"
                autocomplete="off"
                spellcheck="true"
                rows="1"
                placeholder="Write a message..."
            ></textarea>

            <button id="send_button" type="submit">
                Send
            </button>
        </form>
    </main>

    <script id="page_script">
        const language_data = {
            en: {
                title: "Alma Robot",
                status: "Clinic Mode",
                thinking: "Thinking...",
                placeholder: "Write a message...",
                send: "Send",
                initial: "Hello. How can I help you?"
            },

            fr: {
                title: "Alma Robot",
                status: "Mode clinique privée",
                thinking: "En cours...",
                placeholder: "Écrivez un message...",
                send: "Envoyer",
                initial: "Bonjour. Comment puis-je vous aider ?"
            }
        };

        let current_language = "en";


        function detect_language() {
            const browser_language = (
                navigator.language ||
                navigator.userLanguage ||
                "en"
            ).toLowerCase();

            current_language =
                browser_language.startsWith("fr")
                    ? "fr"
                    : "en";
        }


        function apply_language() {
            const language =
                language_data[current_language];

            document.documentElement.lang =
                current_language;

            document.title =
                language.title;

            document.getElementById(
                "chat_title"
            ).textContent =
                language.title;

            document.getElementById(
                "chat_status"
            ).textContent =
                language.status;

            document.getElementById(
                "user_input"
            ).placeholder =
                language.placeholder;

            document.getElementById(
                "send_button"
            ).textContent =
                language.send;

            document.getElementById(
                "message_bubble_initial"
            ).textContent =
                language.initial;


            /*
             * Le message initial possède lui aussi son timestamp.
             *
             * IMPORTANT :
             * On ne le recalcule pas à chaque appel de
             * apply_language(). On lui attribue uniquement
             * un timestamp s'il n'en possède pas encore.
             */
            const initial_bubble =
                document.getElementById(
                    "message_bubble_initial"
                );

            const initial_metadata =
                document.getElementById(
                    "message_metadata_initial"
                );

            const initial_date =
                document.getElementById(
                    "message_date_initial"
                );

            const initial_time =
                document.getElementById(
                    "message_time_initial"
                );

            if (!initial_bubble.dataset.timestamp) {
                initial_bubble.dataset.timestamp =
                    new Date().toISOString();
            }

            set_message_metadata(
                initial_bubble,
                initial_metadata,
                initial_date,
                initial_time
            );
        }


        /*
         * Formate une date à partir d'un timestamp.
         *
         * IMPORTANT :
         * Cette fonction ne fait PAS new Date() toute seule.
         * Elle reçoit toujours le timestamp du message.
         */
        function get_date_from_timestamp(timestamp) {
            return new Intl.DateTimeFormat(
                current_language === "fr"
                    ? "fr-FR"
                    : "en-US",
                {
                    weekday: "short",
                    day: "numeric",
                    month: "short"
                }
            ).format(
                new Date(timestamp)
            );
        }


        function get_time_from_timestamp(timestamp) {
            return new Intl.DateTimeFormat(
                current_language === "fr"
                    ? "fr-FR"
                    : "en-US",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            ).format(
                new Date(timestamp)
            );
        }


        /*
         * Met à jour uniquement l'affichage du timestamp
         * fourni.
         *
         * Le timestamp est donc immuable pour le message.
         */
        function set_message_metadata(
            bubble_element,
            metadata_element,
            date_element,
            time_element
        ) {
            let timestamp =
                bubble_element.dataset.timestamp;

            /*
             * Sécurité : si aucun timestamp n'existe encore,
             * on en crée un une seule fois.
             */
            if (!timestamp) {
                timestamp =
                    new Date().toISOString();

                bubble_element.dataset.timestamp =
                    timestamp;
            }


            date_element.textContent =
                get_date_from_timestamp(timestamp);

            time_element.textContent =
                get_time_from_timestamp(timestamp);


            metadata_element.classList.remove(
                "message_metadata_inline"
            );


            requestAnimationFrame(function () {
                const bubble_width =
                    bubble_element
                        .getBoundingClientRect()
                        .width;

                const date_width =
                    date_element
                        .getBoundingClientRect()
                        .width;

                const time_width =
                    time_element
                        .getBoundingClientRect()
                        .width;

                const gap_width = 6;

                const metadata_width =
                    date_width +
                    time_width +
                    gap_width;


                if (
                    metadata_width <=
                    bubble_width
                ) {
                    metadata_element.classList.add(
                        "message_metadata_inline"
                    );
                }
            });
        }


        function scroll_to_bottom() {
            const messages_element =
                document.getElementById(
                    "chat_messages"
                );

            messages_element.scrollTo({
                top:
                    messages_element.scrollHeight,
                behavior: "smooth"
            });
        }


        function create_message_container(
            sender_type,
            timestamp = null
        ) {
            const unique_id =
                Date.now() +
                "_" +
                Math.random()
                    .toString(36)
                    .substring(2, 8);


            const container_element =
                document.createElement("div");

            const bubble_element =
                document.createElement("div");

            const metadata_element =
                document.createElement("div");

            const date_element =
                document.createElement("div");

            const time_element =
                document.createElement("div");


            container_element.id =
                "message_container_" +
                sender_type +
                "_" +
                unique_id;

            bubble_element.id =
                "message_bubble_" +
                sender_type +
                "_" +
                unique_id;

            metadata_element.id =
                "message_metadata_" +
                sender_type +
                "_" +
                unique_id;

            date_element.id =
                "message_date_" +
                sender_type +
                "_" +
                unique_id;

            time_element.id =
                "message_time_" +
                sender_type +
                "_" +
                unique_id;


            container_element.className =
                "message_container message_container_" +
                sender_type;

            bubble_element.className =
                "message_bubble message_bubble_" +
                sender_type;

            metadata_element.className =
                "message_metadata";

            date_element.className =
                "message_date";

            time_element.className =
                "message_time";


            /*
             * Le timestamp est stocké directement dans
             * le DOM du message.
             */
            bubble_element.dataset.timestamp =
                timestamp ||
                new Date().toISOString();


            metadata_element.appendChild(
                date_element
            );

            metadata_element.appendChild(
                time_element
            );

            container_element.appendChild(
                bubble_element
            );

            container_element.appendChild(
                metadata_element
            );


            return {
                container: container_element,
                bubble: bubble_element,
                metadata: metadata_element,
                date: date_element,
                time: time_element
            };
        }


        function add_message(
            message_text,
            sender_type,
            timestamp = null
        ) {
            const message_elements =
                create_message_container(
                    sender_type,
                    timestamp
                );


            message_elements.bubble.textContent =
                message_text;


            document.getElementById(
                "chat_messages"
            ).appendChild(
                message_elements.container
            );


            set_message_metadata(
                message_elements.bubble,
                message_elements.metadata,
                message_elements.date,
                message_elements.time
            );


            scroll_to_bottom();f


            return message_elements;
        }


        function add_user_message(
            message_text,
            timestamp = null
        ) {
            return add_message(
                message_text,
                "user",
                timestamp
            );
        }


        function create_typing_message() {
            /*
             * Le timestamp du message ordinateur doit
             * correspondre à l'heure de réception de la réponse,
             * pas à l'heure où l'animation "..." commence.
             *
             * On ne lui donne donc PAS encore de timestamp.
             */
            const message_elements =
                create_message_container(
                    "computer",
                    null
                );


            /*
             * On retire le timestamp provisoire.
             * Il sera défini lorsque la vraie réponse arrivera.
             */
            delete message_elements.bubble.dataset.timestamp;


            const typing_container =
                document.createElement("span");

            const first_dot =
                document.createElement("span");

            const second_dot =
                document.createElement("span");

            const third_dot =
                document.createElement("span");


            const typing_id =
                Date.now();


            typing_container.id =
                "typing_indicator_" +
                typing_id;

            first_dot.id =
                "typing_dot_1_" +
                typing_id;

            second_dot.id =
                "typing_dot_2_" +
                typing_id;

            third_dot.id =
                "typing_dot_3_" +
                typing_id;


            typing_container.className =
                "typing_dots";

            first_dot.className =
                "typing_dot";

            second_dot.className =
                "typing_dot";

            third_dot.className =
                "typing_dot";


            typing_container.appendChild(
                first_dot
            );

            typing_container.appendChild(
                second_dot
            );

            typing_container.appendChild(
                third_dot
            );


            message_elements.bubble.appendChild(
                typing_container
            );


            document.getElementById(
                "chat_messages"
            ).appendChild(
                message_elements.container
            );


            /*
             * Pas de set_message_metadata ici :
             * l'heure définitive sera celle de réception
             * de la réponse.
             */


            scroll_to_bottom();


            return message_elements;
        }


        function prepare_computer_input(
            user_text,
            message_timestamp
        ) {
            return {
                message: user_text,
                language: current_language,

                /*
                 * Timestamp exact du moment où
                 * l'utilisateur envoie son message.
                 */
                timestamp:
                    message_timestamp ||
                    new Date().toISOString()
            };
        }


        function receive_user_input(user_text) {
            const clean_text =
                user_text.trim();


            if (!clean_text) {
                return null;
            }


            /*
             * Le timestamp est créé UNE SEULE FOIS,
             * au moment de l'envoi.
             */
            const sent_timestamp =
                new Date().toISOString();


            const user_message =
                add_user_message(
                    clean_text,
                    sent_timestamp
                );


            const computer_input =
                prepare_computer_input(
                    clean_text,
                    sent_timestamp
                );


            document.getElementById(
                "chat_status"
            ).textContent =
                language_data[
                    current_language
                ].thinking;


            return computer_input;
        }


        function answer_from_computer(
            computer_text,
            computer_input
        ) {
            const clean_text =
                String(
                    computer_text || ""
                ).trim();


            if (!clean_text) {
                return;
            }


            add_computer_message_after_typing(
                clean_text,
                computer_input
            );
        }


        async function add_computer_message_after_typing(
            computer_text,
            computer_input
        ) {
            const typing_message =
                create_typing_message();


            /*
             * Cette fonction représente l'heure à laquelle
             * la réponse informatique est réellement reçue.
             *
             * Si le serveur fournit un timestamp,
             * on pourra le remplacer par celui-ci.
             */
            let computer_timestamp =
                new Date().toISOString();


            if (false) {
                /*
                 * Mode simulation.
                 */
                setTimeout(function () {

                    computer_timestamp =
                        new Date().toISOString();

                    typing_message.bubble.textContent =
                        computer_text;

                    typing_message.bubble.dataset.timestamp =
                        computer_timestamp;


                    set_message_metadata(
                        typing_message.bubble,
                        typing_message.metadata,
                        typing_message.date,
                        typing_message.time
                    );


                    document.getElementById(
                        "chat_status"
                    ).textContent =
                        language_data[
                            current_language
                        ].status;


                    scroll_to_bottom();

                }, 2000);

                return;
            }


            /*
             * REAL ANSWER
             */
            const id = "web";

            const q =
                computer_input.message;


            let addr =
                "/chatola/chatola_client.py?id=" +
                encodeURIComponent(id);

            addr +=
                "&q=" +
                encodeURIComponent(q);


            try {
                const response =
                    await fetch(addr);


                console.log(
                    "response:",
                    response
                );


                const raw_response =
                    await response.text();


                console.log(
                    "raw response:",
                    JSON.stringify(
                        raw_response
                    )
                );


                let answer = null;


                if (!raw_response.trim()) {
                    console.log(
                        "Réponse vide"
                    );

                    answer = null;

                } else {
                    try {
                        answer =
                            JSON.parse(
                                raw_response
                            );

                        console.log(
                            "answer:",
                            answer
                        );

                        computer_text =
                            answer.ans;


                        /*
                         * SI ton serveur renvoie un timestamp,
                         * on l'utilise.
                         *
                         * Exemple accepté :
                         *
                         * {
                         *     "ans": "...",
                         *     "timestamp": "2026-09-29T10:15:23.123Z"
                         * }
                         */
                        if (
                            answer.timestamp
                        ) {
                            computer_timestamp =
                                answer.timestamp;
                        }

                        /*
                         * Variante possible si ton backend
                         * appelle le champ "updated_at".
                         */
                        else if (
                            answer.updated_at
                        ) {
                            computer_timestamp =
                                answer.updated_at;
                        }

                    } catch (error) {
                        console.log(
                            "Réponse non JSON:",
                            raw_response
                        );

                        answer =
                            raw_response;

                        computer_text = "?";
                    }
                }


                /*
                 * La réponse est maintenant définitive.
                 */
                typing_message.bubble.textContent =
                    computer_text;


                /*
                 * On enregistre définitivement
                 * l'heure de la réponse.
                 */
                typing_message.bubble.dataset.timestamp =
                    computer_timestamp;


                set_message_metadata(
                    typing_message.bubble,
                    typing_message.metadata,
                    typing_message.date,
                    typing_message.time
                );


                document.getElementById(
                    "chat_status"
                ).textContent =
                    language_data[
                        current_language
                    ].status;


                scroll_to_bottom();


            } catch (error) {

                console.error(
                    "Erreur lors de la requête:",
                    error
                );


                computer_text =
                    current_language === "fr"
                        ? "Erreur lors de la communication."
                        : "Communication error.";


                computer_timestamp =
                    new Date().toISOString();


                typing_message.bubble.textContent =
                    computer_text;


                typing_message.bubble.dataset.timestamp =
                    computer_timestamp;


                set_message_metadata(
                    typing_message.bubble,
                    typing_message.metadata,
                    typing_message.date,
                    typing_message.time
                );


                document.getElementById(
                    "chat_status"
                ).textContent =
                    language_data[
                        current_language
                    ].status;


                scroll_to_bottom();
            }
        }


        function handle_user_message(
            user_text
        ) {
            const computer_input =
                receive_user_input(
                    user_text
                );


            if (!computer_input) {
                return;
            }


            computer_process_input(
                computer_input
            );
        }


        async function computer_process_input(
            computer_input
        ) {
            console.log(
                "INF: computer_process_input: input:",
                computer_input
            );


            let response_text =
                current_language === "fr"
                    ? "J'ai reçu votre message : " +
                      computer_input.message

                    : "I received your message: " +
                      computer_input.message;


            answer_from_computer(
                response_text,
                computer_input
            );
        }


        document.getElementById(
            "chat_input_area"
        ).addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const input_element =
                    document.getElementById(
                        "user_input"
                    );


                const user_text =
                    input_element.value;


                input_element.value = "";


                handle_user_message(
                    user_text
                );


                input_element.focus();
            }
        );


        document.getElementById(
            "user_input"
        ).addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {
                    event.preventDefault();


                    document.getElementById(
                        "chat_input_area"
                    ).requestSubmit();
                }
            }
        );


        /*
         * Lors d'un resize :
         *
         * On réaffiche les timestamps existants.
         * On ne crée JAMAIS un nouveau timestamp.
         */
        window.addEventListener(
            "resize",
            function () {

                const message_elements =
                    document.querySelectorAll(
                        ".message_container"
                    );


                message_elements.forEach(
                    function (message_element) {

                        const bubble_element =
                            message_element.querySelector(
                                ".message_bubble"
                            );

                        const metadata_element =
                            message_element.querySelector(
                                ".message_metadata"
                            );

                        const date_element =
                            message_element.querySelector(
                                ".message_date"
                            );

                        const time_element =
                            message_element.querySelector(
                                ".message_time"
                            );


                        if (
                            bubble_element &&
                            metadata_element &&
                            date_element &&
                            time_element
                        ) {

                            /*
                             * Le timestamp est déjà dans
                             * bubble_element.dataset.timestamp.
                             */
                            set_message_metadata(
                                bubble_element,
                                metadata_element,
                                date_element,
                                time_element
                            );
                        }
                    }
                );
            }
        );


        detect_language();

        apply_language();
    </script>
</body>
</html>
