<script id="script_gallery">
    function createImagePingPong(widgetId, imageA, imageB, duration = 10000) {
        const widgetElement = document.getElementById(widgetId);
        const imageElements = widgetElement.querySelectorAll(
            ".gallery_widget_image"
        );

        if (imageElements.length !== 2) {
            return;
        }

        const imageAElement = imageElements[0];
        const imageBElement = imageElements[1];

        imageAElement.src = imageA;
        imageBElement.src = imageB;

        imageAElement.style.opacity = "1";
        imageBElement.style.opacity = "0";

        imageAElement.style.transition = "none";
        imageBElement.style.transition = "none";

        const transitionDuration = duration / 2;

        function transitionTo(targetA, targetB, callback) {
            imageAElement.style.transition =
                `opacity ${transitionDuration}ms ease-in-out`;

            imageBElement.style.transition =
                `opacity ${transitionDuration}ms ease-in-out`;

            requestAnimationFrame(function () {
                imageAElement.style.opacity = targetA;
                imageBElement.style.opacity = targetB;
            });

            setTimeout(callback, transitionDuration);
        }

        function fadeToB() {
            transitionTo(0, 1, fadeToA);
        }

        function fadeToA() {
            transitionTo(1, 0, fadeToB);
        }

        requestAnimationFrame(function () {
            setTimeout(fadeToB, 100);
        });
    }

    document.querySelectorAll(".gallery_widget").forEach(function (widgetElement) {
        createImagePingPong(
            widgetElement.id,
            widgetElement.dataset.imageA,
            widgetElement.dataset.imageB
        );
    });
</script>
