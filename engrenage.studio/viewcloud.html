<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Gallery</title>

    <style>
        :root{
            --bg:#f5f7fb;
            --card:#ffffff;
            --text:#20232a;
            --sub:#6b7280;
            --accent:#3b82f6;
            --shadow:0 10px 30px rgba(0,0,0,.08);
            --radius:18px;
        }

        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
            font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
        }

        body{
            background:var(--bg);
            color:var(--text);
        }

        #page_root{
            max-width:1800px;
            margin:auto;
            padding:30px;
        }

        #header_container{
            position:sticky;
            top:0;
            z-index:100;
            background:rgba(245,247,251,.92);
            backdrop-filter:blur(18px);
            border-radius:var(--radius);
            box-shadow:var(--shadow);
            padding:30px;
            margin-bottom:30px;
        }

        #title_text{
            font-size:42px;
            font-weight:700;
        }

        #stats_container{
            display:flex;
            flex-wrap:wrap;
            gap:20px;
            margin-top:20px;
        }

        .stats_box{
            background:white;
            border-radius:14px;
            padding:18px 26px;
            box-shadow:var(--shadow);
        }

        .stats_value{
            font-size:30px;
            font-weight:bold;
        }

        .stats_label{
            color:var(--sub);
            font-size:18px;
        }

        #gallery_grid{
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
            gap:28px;
        }

        .media_card{
            position:relative;
            overflow:hidden;
            background:white;
            border-radius:20px;
            box-shadow:var(--shadow);
            transition:.25s;
            cursor:pointer;
        }

        .media_card:hover{
            transform:translateY(-6px);
        }

        .media_thumbnail{
            width:100%;
            height:240px;
            object-fit:cover;
            display:block;
        }

        .media_overlay{
            position:absolute;
            inset:0;
            background:rgba(0,0,0,.78);
            color:white;
            opacity:0;
            transition:.25s;
            padding:22px;
            display:flex;
            flex-direction:column;
            justify-content:center;
            gap:10px;
            font-size:18px;
        }

        .media_card:hover .media_overlay{
            opacity:1;
        }

        #loading_container{
            text-align:center;
            padding:60px;
            font-size:28px;
            color:var(--sub);
        }

        @media(max-width:700px){

            #title_text{
                font-size:32px;
            }

            .stats_value{
                font-size:24px;
            }

            .media_thumbnail{
                height:220px;
            }

        }
    </style>

</head>

<body>

    <div id="page_root">

        <div id="header_container">

            <div id="title_text"></div>

            <div id="stats_container">

                <div id="stats_files_box" class="stats_box">
                    <div id="stats_files_value" class="stats_value">0</div>
                    <div id="stats_files_label" class="stats_label"></div>
                </div>

                <div id="stats_size_box" class="stats_box">
                    <div id="stats_size_value" class="stats_value">0 MB</div>
                    <div id="stats_size_label" class="stats_label"></div>
                </div>

            </div>

        </div>

        <div id="gallery_grid"></div>

        <div id="loading_container"></div>

    </div>

<script>

const language = navigator.language.toLowerCase().startsWith("fr") ? "fr" : "en";

const text = {

    fr:{
        title:"Galerie média",
        files:"Fichiers",
        size:"Taille totale",
        loading:"Chargement...",
        folder:"Dossier",
        file:"Fichier",
        date:"Date",
        bytes:"Taille"
    },

    en:{
        title:"Media Gallery",
        files:"Files",
        size:"Total size",
        loading:"Loading...",
        folder:"Folder",
        file:"File",
        date:"Date",
        bytes:"Size"
    }

};

const ui = text[language];

document.getElementById("title_text").textContent = ui.title;
document.getElementById("stats_files_label").textContent = ui.files;
document.getElementById("stats_size_label").textContent = ui.size;
document.getElementById("loading_container").textContent = ui.loading;

let mediaFiles = [];
let currentIndex = 0;
const pageSize = 50;

async function loadMedia(){

    const response = await fetch("viewcloud.py?list");
    
    console.log( "Response:", response )

    mediaFiles = await response.json();
    
    console.log( "mediaFiles:", mediaFiles )

    document.getElementById("stats_files_value").textContent = mediaFiles.count;

    let total = 0;

    mediaFiles.files.forEach(f=>total += f.size);

    document.getElementById("stats_size_value").textContent = formatSize(total);

    appendCards();

}

function appendCards(){

    const grid = document.getElementById("gallery_grid");

    const end = Math.min(currentIndex + pageSize, mediaFiles.length);

    for(let i=currentIndex;i<end;i++){

        const item = mediaFiles[i];

        const card = document.createElement("div");
        card.className="media_card";

        const img = document.createElement(item.type==="video"?"video":"img");
        img.className="media_thumbnail";
        img.src=item.thumbnail;

        if(item.type==="video"){
            img.muted=true;
            img.loop=true;
            img.autoplay=true;
            img.playsInline=true;
        }

        const overlay=document.createElement("div");
        overlay.className="media_overlay";

        overlay.innerHTML=
            "<b>"+ui.file+"</b><div>"+item.name+"</div>"+
            "<b>"+ui.folder+"</b><div>"+item.folder+"</div>"+
            "<b>"+ui.bytes+"</b><div>"+formatSize(item.size)+"</div>"+
            "<b>"+ui.date+"</b><div>"+new Date(item.date).toLocaleString()+"</div>";

        card.appendChild(img);
        card.appendChild(overlay);

        grid.appendChild(card);

    }

    currentIndex=end;

    document.getElementById("loading_container").style.display=currentIndex>=mediaFiles.length?"none":"block";

}

function formatSize(bytes){

    const units=["B","KB","MB","GB","TB"];

    let i=0;

    while(bytes>1024 && i<units.length-1){

        bytes/=1024;
        i++;

    }

    return bytes.toFixed(1)+" "+units[i];

}

window.addEventListener("scroll",()=>{

    if(window.innerHeight+window.scrollY>document.body.offsetHeight-800){

        if(currentIndex<mediaFiles.length){

            appendCards();

        }

    }

});

loadMedia();

</script>

</body>
</html>
